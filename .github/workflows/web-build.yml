name: Photoroom web build

on:
  push:
    branches: [main]
    paths:
      - "apps/photocraft-web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Trunk.toml"
      - "vercel.json"
      - "deploy/**"
      - ".github/workflows/web-build.yml"
  pull_request:
    paths:
      - "apps/photocraft-web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Trunk.toml"
      - "vercel.json"
      - "deploy/**"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Build browser app
        working-directory: apps/photocraft-web
        run: trunk build --release
      - name: Verify static output
        run: test -s dist/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: photoroom-web-dist
          path: dist/web/
          if-no-files-found: error
          retention-days: 7
